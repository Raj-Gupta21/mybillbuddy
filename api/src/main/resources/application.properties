spring.application.name=api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/mybillbuddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=#avisa200700

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080
app.auth.username=${APP_LOGIN_USERNAME:}
app.auth.password=${APP_LOGIN_PASSWORD:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:mybillbuddy-api}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
